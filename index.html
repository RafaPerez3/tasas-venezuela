    <style>
        body { font-family: 'Inter', sans-serif; background-color: #121212; color: white; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { margin-bottom: 5px; }
        .subtitle { color: #888; margin-bottom: 20px; font-size: 0.9rem; font-weight: bold; }
        
        .card {
            background: #1e1e1e;
            width: 100%;
            max-width: 350px;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-align: center;
            border: 1px solid #333;
        }

        .card-usd { border-color: #27ae60; }
        .card-eur { border-color: #3498db; }
        .card-binance { border-color: #f1c40f; }

        .card-title { color: #aaa; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; }
        .price { font-size: 2.2rem; font-weight: 700; margin: 5px 0; }

        .usd-color { color: #27ae60; }
        .eur-color { color: #3498db; }
        .usdt-color { color: #f1c40f; }

        /* --- SKELETON DE CARGA --- */
        .skeleton {
            display: inline-block;
            width: 130px;
            max-width: 60%;
            height: 1.7rem;
            border-radius: 6px;
            background: linear-gradient(90deg, #2a2a2a 25%, #3a3a3a 50%, #2a2a2a 75%);
            background-size: 200% 100%;
            animation: brillo 1.4s infinite;
            vertical-align: middle;
        }
        @keyframes brillo {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* --- ESTILOS DE LA CALCULADORA --- */
        .calc-area {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #333;
        }
        
        .calc-input {
            width: 70%;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #2c2c2c;
            color: white;
            text-align: center;
            font-size: 1rem;
            outline: none;
        }
        
        .calc-input:focus { border-color: #007bff; }

        .calc-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .calc-label {
            font-size: 0.7rem;
            color: #777;
        }

        .swap-btn {
            background: #2c2c2c;
            border: 1px solid #444;
            color: #ccc;
            width: 22px;
            height: 22px;
            padding: 0;
            margin: 0;
            border-radius: 50%;
            font-size: 0.85rem;
            line-height: 1;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.2s, transform 0.2s;
        }

        .swap-btn:hover { background: #3a3a3a; }
        .swap-btn:active { transform: rotate(180deg); }

        .calc-result {
            display: block;
            margin-top: 8px;
            color: #ccc;
            font-size: 1.1rem;
            font-weight: bold;
        }

        button {
            background: #007bff; color: white; border: none; padding: 12px 25px; 
            border-radius: 50px; font-size: 1rem; cursor: pointer; margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover { background: #0056b3; }
        button:disabled { background: #555; cursor: not-allowed; }
    </style>
</head>
<body>

    <h1>Tasas Hoy 🇻🇪</h1>
    <span id="hora" class="subtitle">Esperando datos...</span>

    <div class="card card-usd">
        <div class="card-title">BCV Dólar</div>
        <div id="bcv-usd" class="price usd-color"><span class="skeleton"></span></div>
        
        <div class="calc-area">
            <div class="calc-header">
                <span class="calc-label" id="label-usd">Dólares → Bolívares</span>
                <button class="swap-btn" onclick="invertir('usd')" title="Invertir conversión" aria-label="Invertir conversión">⇄</button>
            </div>
            <input type="number" class="calc-input" id="input-usd" placeholder="Monto $" oninput="calcular('usd', this.value)">
            <span id="res-usd" class="calc-result">Bs. 0.00</span>
        </div>
    </div>

    <div class="card card-eur">
        <div class="card-title">BCV Euro</div>
        <div id="bcv-eur" class="price eur-color"><span class="skeleton"></span></div>

        <div class="calc-area">
            <div class="calc-header">
                <span class="calc-label" id="label-eur">Euros → Bolívares</span>
                <button class="swap-btn" onclick="invertir('eur')" title="Invertir conversión" aria-label="Invertir conversión">⇄</button>
            </div>
            <input type="number" class="calc-input" id="input-eur" placeholder="Monto €" oninput="calcular('eur', this.value)">
            <span id="res-eur" class="calc-result">Bs. 0.00</span>
        </div>
    </div>

    <div class="card card-binance">
        <div class="card-title">Binance P2P (Promedio)</div>
        <div id="binance" class="price usdt-color"><span class="skeleton"></span></div>

        <div class="calc-area">
            <div class="calc-header">
                <span class="calc-label" id="label-binance">USDT → Bolívares</span>
                <button class="swap-btn" onclick="invertir('binance')" title="Invertir conversión" aria-label="Invertir conversión">⇄</button>
            </div>
            <input type="number" class="calc-input" id="input-binance" placeholder="Monto USDT" oninput="calcular('binance', this.value)">
            <span id="res-binance" class="calc-result">Bs. 0.00</span>
        </div>
    </div>

    <button id="btn-update" onclick="obtenerDatos()">🔄 Actualizar</button>

    <script>
        // VARIABLE GLOBAL: Aquí guardaremos las tasas reales para usarlas en la calculadora
        let tasasGlobales = { usd: 0, eur: 0, binance: 0 };

        async function obtenerDatos(reintento = false) {
            const btn = document.getElementById('btn-update');
            const hora = document.getElementById('hora');
            
            if (!reintento) {
                btn.disabled = true;
                btn.innerText = "⏳ Cargando...";
                hora.innerText = "Consultando...";
                hora.style.color = "#888";
            }

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 15000);

                const res = await fetch('/api/tasas', { signal: controller.signal });
                clearTimeout(timeoutId);

                if (!res.ok) throw new Error("Error del servidor");

                const data = await res.json();

                // 1. Mostrar precios en pantalla
                document.getElementById('bcv-usd').innerText = "Bs. " + data.bcv.usd;
                document.getElementById('bcv-eur').innerText = "Bs. " + data.bcv.eur;
                document.getElementById('binance').innerText = "Bs. " + data.binance;
                hora.innerText = "Actualizado: " + data.fecha;
                hora.style.color = "#888"; 

                // 2. GUARDAR EN MEMORIA (Importante para la calculadora)
                tasasGlobales.usd = parseFloat(data.bcv.usd);
                tasasGlobales.eur = parseFloat(data.bcv.eur);
                tasasGlobales.binance = parseFloat(data.binance);

                btn.disabled = false;
                btn.innerText = "🔄 Actualizar";

            } catch (error) {
                console.error(error);
                if (!reintento) {
                    hora.innerText = "😴 Servidor despertando...";
                    hora.style.color = "#e74c3c";
                    setTimeout(() => obtenerDatos(true), 4000);
                } else {
                    hora.innerText = "⚠️ Error de conexión.";
                    hora.style.color = "#e74c3c";
                    btn.disabled = false;
                    btn.innerText = "🔁 Reintentar";
                }
            }
        }

        // --- CALCULADORA CON DIRECCIÓN INVERTIBLE ---
        // Info fija de cada tarjeta: cómo se llama la moneda, su símbolo y el placeholder del input.
        const infoMoneda = {
            usd: { nombre: 'Dólares', simbolo: '$ ', placeholder: 'Monto $' },
            eur: { nombre: 'Euros', simbolo: '€ ', placeholder: 'Monto €' },
            binance: { nombre: 'USDT', simbolo: 'USDT ', placeholder: 'Monto USDT' }
        };

        // 'directa' = moneda -> Bs (multiplica). 'inversa' = Bs -> moneda (divide).
        let direcciones = { usd: 'directa', eur: 'directa', binance: 'directa' };

        function invertir(moneda) {
            direcciones[moneda] = direcciones[moneda] === 'directa' ? 'inversa' : 'directa';

            const info = infoMoneda[moneda];
            const input = document.getElementById('input-' + moneda);
            const label = document.getElementById('label-' + moneda);

            if (direcciones[moneda] === 'directa') {
                label.innerText = `${info.nombre} → Bolívares`;
                input.placeholder = info.placeholder;
            } else {
                label.innerText = `Bolívares → ${info.nombre}`;
                input.placeholder = 'Monto Bs';
            }

            // Al invertir, limpiamos el campo para no confundir con el número anterior
            input.value = '';
            calcular(moneda, '');
        }

        function calcular(moneda, cantidad) {
            const resultado = document.getElementById('res-' + moneda);
            const esDirecta = direcciones[moneda] === 'directa';
            const prefijoVacio = esDirecta ? 'Bs. ' : infoMoneda[moneda].simbolo;

            // Si la cantidad está vacía, mostramos 0
            if (!cantidad) {
                resultado.innerText = prefijoVacio + "0.00";
                return;
            }

            let tasa = tasasGlobales[moneda]; // Buscamos la tasa en nuestra memoria global
            if (!tasa) {
                resultado.innerText = "Esperando tasa...";
                return;
            }

            // Directa: moneda -> Bs (multiplica). Inversa: Bs -> moneda (divide).
            let total = esDirecta ? parseFloat(cantidad) * tasa : parseFloat(cantidad) / tasa;

            // Formateamos bonito con separadores de miles (ej: 1.200,50)
            let totalBonito = total.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

            resultado.innerText = prefijoVacio + totalBonito;
        }

        obtenerDatos();
    </script>
</body>
</html>
